[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "macroABM"
version = "0.1.0"
description = "Agent-based macroeconomic simulation framework"
requires-python = ">=3.9"
dependencies = [
    "matplotlib",
    "pandas",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
